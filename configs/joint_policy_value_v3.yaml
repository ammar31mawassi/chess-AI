# Replay composition for the first search-capable policy/value candidate.
# Every source is explicit; no evaluation PGNs or unreviewed external data enter training.
composition:
  output_path: data/datasets/joint_policy_value_v3.pt
  output_weight_key: joint_training_weight
  sources:
    # Preserve the D1 behaviour that produced the current gameplay champion.
    - name: d1_d2_targeted_replay
      path: data/datasets/gen1_vs_d1_d2_teacher_500.pt
      metadata_weight_key: champion_outcome_weight
      group_key: opening_pair_id

    # A small human-game anchor supplies broader, ordinary chess positions.
    - name: filtered_human_games
      path: data/datasets/kaggle_games_15000.pt
      constant_weight: 0.25

    # Tactical evaluations receive more weight because search depends on value quality.
    - name: stockfish_tactics
      path: data/datasets/kaggle_tactics_15000.pt
      constant_weight: 1.25

    # D1/D2/D3 league games preserve harder minimax positions and outcome weighting.
    - name: minimax_d3_teacher
      path: data/datasets/minimax_d1_d2_d3_3000.pt
      metadata_weight_key: actor_outcome_weight
      group_key: opening_set_id
