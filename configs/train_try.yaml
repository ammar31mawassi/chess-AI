seed: 42
device: cuda

generation:
  dataset_path: data/datasets/minimax_500_depth_2.pt
  games: 500

  white_agent: minimax
  black_agent: minimax

  white_depth: 2
  black_depth: 2

  max_moves: 300
  save_every_games: 5
  resume: true

training:
  dataset_path: data/datasets/minimax_d2_diverse_500.pt
  checkpoint_dir: checkpoints/minimax_d2_diverse_500_v2
  metrics_path: data/metrics/minimax_d2_diverse_500_v2.jsonl
  batch_size: 64
  epochs: 5
  learning_rate: 0.00005
  weight_decay: 0.0
  gradient_clip: 1.0
  validation_fraction: 0.2
  scheduler: true
  log_every: 20