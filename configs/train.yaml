# A modest starting point for experimentation, not a recipe for strong chess.
seed: 42
device: auto

model:
  channels: 64
  residual_blocks: 4

generation:
  games: 100
  white_agent: minimax
  black_agent: random
  minimax_depth: 2
  max_moves: 200
  max_examples: 12000
  save_every_games: 10
  dataset_path: data/datasets/bootstrap_v1.pt

training:
  dataset_path: data/datasets/bootstrap_v1.pt
  checkpoint_dir: checkpoints/bootstrap
  metrics_path: data/metrics/bootstrap_training.jsonl
  batch_size: 64
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip: 1.0
  validation_fraction: 0.1
  scheduler: true
  log_every: 20

arena:
  games: 20
  minimax_depth: 2
  max_moves: 200
  pgn_dir: data/games/arena
